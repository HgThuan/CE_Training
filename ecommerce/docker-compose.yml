x-backend-common: &backend-common
  build:
    context: ./backend
    args:
      REQUIREMENTS_FILE: requirements/production.txt
  image: multi-vendor-ai-ecommerce-backend:local
  env_file:
    - ${ENV_FILE:-.env}
  restart: unless-stopped
  networks:
    - ecommerce-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - static_data:/app/staticfiles
    - media_data:/app/media

services:
  backend:
    <<: *backend-common
    command:
      - gunicorn
      - config.asgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --worker-class=uvicorn_worker.UvicornWorker
      - --access-logfile=-
      - --error-logfile=-
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery-worker:
    <<: *backend-common
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=${CELERY_LOG_LEVEL:-INFO}
      - --hostname=celery@%h
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A config inspect ping --destination="celery@$$HOSTNAME"
          --timeout=5 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    <<: *backend-common
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=${CELERY_LOG_LEVEL:-INFO}
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /tmp/celerybeat.pid && kill -0 "$$(cat /tmp/celerybeat.pid)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
    restart: unless-stopped
    networks:
      - ecommerce-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8080/ws}
    image: multi-vendor-ai-ecommerce-frontend:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: ./nginx
    image: multi-vendor-ai-ecommerce-nginx:local
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    networks:
      - ecommerce-network
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  ecommerce-network:
    driver: bridge

volumes:
  redis_data:
  static_data:
  media_data:
