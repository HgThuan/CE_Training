      - message
      - success
    StatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - locked
      type: string
      description: |-
        * `pending` - Chờ duyệt
        * `approved` - Đã duyệt
        * `rejected` - Từ chối
        * `locked` - Bị khóa
    TokenData:
      type: object
      properties:
        access:
          type: string
        access_expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - access_expires_in
      - user
    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/TokenData'
      required:
      - data
      - message
      - success
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        phone:
          oneOf:
          - type: string
            pattern: ^\+?[0-9]{9,15}$
            maxLength: 20
          - type: string
            maxLength: 0
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        profile:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - created_at
      - email
      - id
      - is_active
      - is_email_verified
      - must_change_password
      - profile
      - role
      - updated_at
    UserResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/User'
      required:
      - data
      - message
      - success
    VerificationStatusEnum:
      enum:
      - unverified
      - pending
      - verified
      type: string
      description: |-
        * `unverified` - Chưa xác minh
        * `pending` - Chờ xác minh
        * `verified` - Đã xác minh
    VerifyEmail:
      type: object
      properties:
        token:
          type: string
      required:
      - token
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
